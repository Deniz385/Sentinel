# Configuration for Sentinel's own repository.
#
# This file is also a working example: the "dogfood" step in CI runs
# Sentinel against its own source, so the allowlist below is exercised
# on every commit.
#
# DO NOT PUT SECRETS HERE. Use environment variables:
#   SENTINEL_VAULT_KEY, SENTINEL_WEBHOOK_URL, SENTINEL_FINGERPRINT_SALT

target: .

min_severity: low

exclude_globs:
  - "*.min.js"
  - "*.lock"
  - "htmlcov/**"
  # The incremental scan cache. The engine already skips its own cache;
  # this line also keeps it quiet if the cache is left in a tree scanned
  # some other way.
  - ".sentinel-cache.json"

entropy_scan: true
archive_enabled: true
ocr: false
workers: 0

allowlist:
  paths:
    # A DLP tool's own rule catalogue contains, by definition, one
    # example of every pattern. Scanning this file produces 12
    # unavoidable false positives; the catalogue's correctness is
    # assured by `tests/test_patterns.py`, not by scanning.
    - "sentinel/patterns.py"
    # Test fixtures deliberately carry valid (but invented) values;
    # `tests/conftest.py` documents that they are synthetic.
    - "tests/**"
    # Synthetic data generator: everything it produces is fake.
    - "tools/generate_data.py"
    # Sample leak files in the repository, there to try the tool out.
    - "test_data/**"
    # Documentation describes rule names and example values.
    - "README.md"
    - "ROADMAP.md"
    - "rules/**"

  rules: []
  values: []
  fingerprints: []
  patterns: []

  # AWS's documented example key, example.com addresses, and so on.
  use_defaults: true
  # `# sentinel:ignore` comments
  inline: true
