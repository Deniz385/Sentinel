# Sentinel'in kendi deposu için yapılandırma.
#
# Bu dosya aynı zamanda çalışan bir örnektir: CI'daki "dogfood" adımı
# Sentinel'i kendi kaynak koduna karşı çalıştırır, yani buradaki
# allowlist her commit'te sınanır.
#
# SIRLARI BURAYA YAZMAYIN. Ortam değişkeni kullanın:
#   SENTINEL_VAULT_KEY, SENTINEL_WEBHOOK_URL, SENTINEL_FINGERPRINT_SALT

target: .

min_severity: low

exclude_globs:
  - "*.min.js"
  - "*.lock"
  - "htmlcov/**"

entropy_scan: true
archive_enabled: true
ocr: false
workers: 0

allowlist:
  paths:
    # Bir DLP aracının kendi kural kataloğu, tanım gereği her desenin bir
    # örneğini içerir. Bu dosyayı taramak 12 kaçınılmaz yanlış pozitif
    # üretir; kataloğun doğruluğu `tests/test_patterns.py` ile güvence
    # altındadır, taramayla değil.
    - "sentinel/patterns.py"
    # Test donanımları kasıtlı olarak geçerli (ama uydurma) değerler
    # taşır; `tests/conftest.py` bunların sentetik olduğunu belgeler.
    - "tests/**"
    # Sentetik veri üreteci: ürettiği her şey sahtedir.
    - "tools/generate_data.py"
    # Depodaki örnek sızıntı dosyaları — aracı denemek için vardır.
    - "test_data/**"
    # Dokümantasyon, kural isimlerini ve örnek değerleri anlatır.
    - "README.md"
    - "ROADMAP.md"
    - "rules/**"

  rules: []
  values: []
  fingerprints: []
  patterns: []

  # AWS'in dokümante örnek anahtarı, example.com adresleri vb.
  use_defaults: true
  # `# sentinel:ignore` yorumları
  inline: true
