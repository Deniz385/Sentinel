name: CI

on:
  # `push` runs on the default branch ONLY. Pushing to a branch that has
  # an open PR already fires the `pull_request` event; because their
  # `github.ref` differs (refs/heads/... versus refs/pull/N/merge) they
  # do not share the concurrency group below either. The result was two
  # full runs per push, i.e. double the CI minutes.
  #
  # Use `workflow_dispatch` to run CI on a branch without a PR.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel the previous run when a PR is pushed to repeatedly; on the
  # default branch every commit must keep its own result (for the Code
  # Scanning baseline and release history), so do not cancel there.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool claims to be cross-platform; CI has to prove it.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,pdf,monitor,notify]"

      # YARA needs a compiled extension and may have no wheel for every
      # platform and version combination. We install it where we can, so
      # that `rules/*.yar` is genuinely compiled; where we cannot, the
      # related tests skip and the job still passes.
      - name: YARA (best effort)
        continue-on-error: true
        run: pip install -e ".[yara]"

      - name: Tests
        run: pytest -q --cov=sentinel --cov-report=term-missing

      - name: CLI smoke test
        run: |
          sentinel --version
          sentinel doctor
          sentinel rules --json > /dev/null
        shell: bash

      - name: Core install must work without extras
        # A security tool has to start and scan text even when none of
        # its optional dependencies are present.
        run: |
          python - <<'PY'
          import os, subprocess, sys, venv, tempfile
          base = tempfile.mkdtemp()
          venv.create(base, with_pip=True)
          bindir = "Scripts" if os.name == "nt" else "bin"
          python = os.path.join(base, bindir, "python")
          subprocess.run([python, "-m", "pip", "install", "-q", "."], check=True)
          subprocess.run([python, "-c", "import sentinel.cli; print('core import ok')"], check=True)
          PY
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
        continue-on-error: true

  dogfood:
    name: Sentinel scans its own repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[docs]"

      # Verify on every PR that no real secret is left in the repo.
      # Scope and allowlist come from `sentinel.yml` in the repository,
      # so that file is exercised on every commit too.
      - name: Secret scan
        run: sentinel scan . --format sarif,md --fail-on high

      - name: Write the summary to the job output
        if: always()
        run: cat scan_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: sentinel.sarif
          category: sentinel-dlp
